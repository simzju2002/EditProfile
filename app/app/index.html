
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .container {
            margin: 40px auto;
            width: 80%;
        }

        .button {
            width: 160px;
            height: 45px;
            border-radius: 6px;
            font-size: 15px;
            margin-top: 20px;
            cursor: pointer;
        }

        img {
            width: 328px;
            height: 287px;
            display: block;
            margin-bottom: 20px;
        }

        hr {
            width: 400px;
            margin-left: 0;
        }

        h3 {
            display: inline-block;
        }

        #container,
        #container-edit {
            display: none;
        }

        #container-edit input {
            height: 32px;
            width: 195px;
            font-size: 15px;
        }

        #container-edit hr {
            margin: 25px 0;
        }

        #error {
            display: none;
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container" id="container">
        <h1>User profile</h1>

        <img src="/profile-picture" alt="user-profile">

        <span>Name: </span>
        <h3 id="name">Anna Smith</h3>

        <hr>

        <span>Email: </span>
        <h3 id="email">anna.smith@example.com</h3>

        <hr>

        <span>Interests: </span>
        <h3 id="interests">coding</h3>

        <hr>

        <button class="button" onclick="updateProfile()">
            Edit Profile
        </button>

        <div id="error"></div>
    </div>


    <div class="container" id="container-edit">
        <h1>User profile</h1>

        <img src="/profile-picture" alt="user-profile">

        <span>Name: </span>
        <input type="text" id="input-name">

        <hr>

        <span>Email: </span>
        <input type="email" id="input-email">

        <hr>

        <span>Interests: </span>
        <input type="text" id="input-interests">

        <hr>

        <button class="button" onclick="handleUpdateProfileRequest()">
            Update Profile
        </button>

        <button class="button" onclick="cancelUpdate()">
            Cancel
        </button>

        <div id="error-edit"></div>
    </div>


    <script>
        const container = document.getElementById("container");
        const containerEdit = document.getElementById("container-edit");

        async function loadProfile() {
            try {
                console.log("Loading profile...");

                const response = await fetch("/get-profile");

                console.log("Response status:", response.status);

                if (!response.ok) {
                    throw new Error(
                        `Server returned HTTP ${response.status}`
                    );
                }

                const user = await response.json();

                console.log("Profile received:", user);

                document.getElementById("name").textContent =
                    user.name || "Anna Smith";

                document.getElementById("email").textContent =
                    user.email || "anna.smith@example.com";

                document.getElementById("interests").textContent =
                    user.interests || "coding";

                container.style.display = "block";

            } catch (error) {
                console.error("Failed to load profile:", error);

                container.style.display = "block";

                document.getElementById("error").style.display = "block";
                document.getElementById("error").textContent =
                    "Failed to load profile: " + error.message;
            }
        }


        async function handleUpdateProfileRequest() {
            try {
                const payload = {
                    name: document.getElementById("input-name").value.trim(),
                    email: document.getElementById("input-email").value.trim(),
                    interests: document.getElementById("input-interests").value.trim()
                };

                console.log("Updating profile:", payload);

                const response = await fetch("/update-profile", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                console.log("Update response:", response.status);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(
                        errorData.error || `HTTP ${response.status}`
                    );
                }

                const updatedUser = await response.json();

                console.log("Updated profile:", updatedUser);

                document.getElementById("name").textContent =
                    updatedUser.name || "";

                document.getElementById("email").textContent =
                    updatedUser.email || "";

                document.getElementById("interests").textContent =
                    updatedUser.interests || "";

                containerEdit.style.display = "none";
                container.style.display = "block";

            } catch (error) {
                console.error("Failed to update profile:", error);

                const errorElement =
                    document.getElementById("error-edit");

                errorElement.style.display = "block";
                errorElement.textContent =
                    "Failed to update profile: " + error.message;
            }
        }


        function updateProfile() {
            document.getElementById("input-name").value =
                document.getElementById("name").textContent;

            document.getElementById("input-email").value =
                document.getElementById("email").textContent;

            document.getElementById("input-interests").value =
                document.getElementById("interests").textContent;

            container.style.display = "none";
            containerEdit.style.display = "block";
        }


        function cancelUpdate() {
            containerEdit.style.display = "none";
            container.style.display = "block";
        }


        loadProfile();
    </script>

</body>
</html>
